<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Student Attendance Tracker</title>

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">

</head>


<body>


<!-- ================= NAVBAR ================= -->

<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <span class="navbar-brand">
            Student Attendance Tracker
        </span>

        <a class="nav-link text-white"
           href="#addStudent">
            Add Student
        </a>

    </div>

</nav>


<!-- ================= INTRODUCTION ================= -->

<div class="container mt-4">

    <div class="text-center">

        <h1>Student Attendance Tracker</h1>

        <p>
            A simple application to manage student attendance.
        </p>

    </div>

</div>


<!-- ================= DASHBOARD ================= -->

<div class="container mt-4">

    <div class="row">

        <div class="col-md-6">

            <div class="card text-center">

                <div class="card-body">

                    <h3 id="totalStudents">0</h3>

                    <p>Total Students</p>

                </div>

            </div>

        </div>


        <div class="col-md-6">

            <div class="card text-center">

                <div class="card-body">

                    <h3 id="averageAttendance">
                        0%
                    </h3>

                    <p>Average Attendance</p>

                </div>

            </div>

        </div>

    </div>

</div>


<!-- ================= ADD STUDENT ================= -->

<div
    class="container mt-5"
    id="addStudent">

    <h2>Add Student</h2>

    <!-- Bootstrap Alert -->

    <div id="alertBox"></div>


    <div class="form-box">

        <!-- POST method -->

        <form
            id="studentForm"
            method="POST">

            <div class="row">


                <!-- Name -->

                <div class="col-md-6 mb-3">

                    <label
                        for="studentName"
                        class="form-label">

                        Student Name

                    </label>

                    <input
                        type="text"
                        id="studentName"
                        class="form-control"
                        placeholder="Enter name"
                        required>

                </div>


                <!-- Roll Number -->

                <div class="col-md-6 mb-3">

                    <label
                        for="rollNo"
                        class="form-label">

                        Roll Number

                    </label>

                    <input
                        type="number"
                        id="rollNo"
                        class="form-control"
                        placeholder="Enter roll number"
                        required>

                </div>


                <!-- Email -->

                <div class="col-md-6 mb-3">

                    <label
                        for="email"
                        class="form-label">

                        Email

                    </label>

                    <input
                        type="email"
                        id="email"
                        class="form-control"
                        placeholder="example@gmail.com"
                        required>

                </div>


                <!-- Department -->

                <div class="col-md-6 mb-3">

                    <label
                        for="department"
                        class="form-label">

                        Department

                    </label>

                    <select
                        id="department"
                        class="form-select"
                        required>

                        <option value="">
                            Select Department
                        </option>

                        <option value="CSE">
                            CSE
                        </option>

                        <option value="ECE">
                            ECE
                        </option>

                        <option value="EEE">
                            EEE
                        </option>

                        <option value="MECH">
                            MECH
                        </option>

                    </select>

                </div>


                <!-- Gender -->

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Gender
                    </label>

                    <div>

                        <input
                            type="radio"
                            name="gender"
                            value="Male">

                        Male


                        <input
                            type="radio"
                            name="gender"
                            value="Female"
                            class="ms-3">

                        Female

                    </div>

                </div>


                <!-- Date -->

                <div class="col-md-6 mb-3">

                    <label
                        for="date"
                        class="form-label">

                        Date

                    </label>

                    <input
                        type="date"
                        id="date"
                        class="form-control"
                        required>

                </div>

            </div>


            <!-- Buttons -->

            <button
                type="submit"
                class="btn btn-primary">

                Add Student

            </button>


            <button
                type="reset"
                class="btn btn-secondary">

                Reset

            </button>

        </form>

    </div>

</div>


<!-- ================= STUDENT TABLE ================= -->

<div class="container mt-5 mb-5">

    <h2>Student Records</h2>


    <div class="table-responsive">

        <table class="table table-bordered">

            <thead class="table-dark">

                <tr>

                    <th>Roll No</th>

                    <th>Name</th>

                    <th>Department</th>

                    <th>Present</th>

                    <th>Absent</th>

                    <th>Attendance</th>

                    <th>Action</th>

                </tr>

            </thead>


            <tbody id="studentTable">

            </tbody>

        </table>

    </div>

</div>


<!-- Bootstrap JavaScript -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


<!-- jQuery -->

<script
    src="https://code.jquery.com/jquery-3.7.1.min.js">
</script>


<!-- JavaScript -->

<script src="script.js"></script>


</body>

</html>
